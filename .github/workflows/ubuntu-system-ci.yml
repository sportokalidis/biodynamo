# Runs the installation tests and valgrind tests in the following cases:
#   1) every day at 3 am
#   2) a pull request to the master branch
#   3) a push or manual dispatch

name: Ubuntu System CI

on:
  push:
  workflow_dispatch:
  schedule:
    # Every day at 3 am
    - cron: '0 3 * * *'
  pull_request:
    # Upon pull requests
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout BioDynaMo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select build environment
      run: |
        echo "OSVERS=${{ matrix.os }}" >> "$GITHUB_ENV"
        BDM_PYTHON_VERSION=3.9.1
        if [ -f "util/installation/${{ matrix.os }}/environment.sh" ]; then
          . "util/installation/${{ matrix.os }}/environment.sh"
          printf '%s\n' "CC=$CC" "CXX=$CXX" "OMPI_CC=$OMPI_CC" "OMPI_CXX=$OMPI_CXX" >> "$GITHUB_ENV"
        fi
        echo "BDM_PYTHON_VERSION=$BDM_PYTHON_VERSION" >> "$GITHUB_ENV"

    - name: Cache pyenv
      uses: actions/cache@v4
      id: pyenv-cache
      with:
        path: ~/.pyenv
        key: ${{ matrix.os }}-${{ runner.arch }}-pyenv-${{ env.BDM_PYTHON_VERSION }}-${{ hashFiles('util/installation/ubuntu-26.04/*') }}

    - name: Start Xvfb
      run: |
        set -e
        sudo apt update
        sudo apt-get -y install xvfb
        XVFBARGS=":99 -ac -screen 0 2560x1440x24"
        /usr/bin/Xvfb $XVFBARGS >> /tmp/Xvfb.out 2>&1 &
        disown -ar
        sleep 3

    - name: Install BioDynaMo from the checked-out revision
      shell: bash
      run: |
        # A separate clone tests the installer and lets us remove its build tree.
        # Use the checked-out commit, including the PR merge commit on forks.
        install_source=$(mktemp -d "$RUNNER_TEMP/bdm-install.XXXXXX")
        trap 'rm -rf "$install_source"' EXIT
        git clone --no-hardlinks . "$install_source/biodynamo"
        cd "$install_source/biodynamo"
        SILENT_INSTALL=1 BDM_CMAKE_FLAGS="-Dtest=off -Dnotebooks=off -Dsbml=off" ./install.sh
        version=$(cat build/version/bdm_shortversion)
        echo "INSTALL_DIR=$HOME/biodynamo-v$version" >> "$GITHUB_ENV"

    - name: Cache Third Party Packages
      uses: actions/cache@v4
      with:
        path: build/third_party
        key: ${{ env.OSVERS }}-third-party-${{ hashFiles('cmake/external/SHA256Digests.cmake') }}

    # Don't do this in the `Build BioDynaMo step`, because notebooks might time out in GHA
    # runners, while waiting for other targets to be compiled. Run notebooks only
    # if the event is a pull request, and on ubuntu-22.04.
    - name: Run notebooks
      shell: bash
      run: |
        export PATH="$HOME/.pyenv/bin:$PATH"
        eval "$(pyenv init --path)"
        eval "$(pyenv init -)"
        pyenv shell "$BDM_PYTHON_VERSION"
        cmake \
          -Dnotebooks=ON \
          -Dsbml=OFF \
          -Dnuma=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -Dreal_t=double \
          -B build
        cmake --build build --parallel --config Release --target notebooks  -- -j1
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-22.04'


    - name: Build BioDynaMo
      shell: bash
      run: |
        export PATH="$HOME/.pyenv/bin:$PATH"
        eval "$(pyenv init --path)"
        eval "$(pyenv init -)"
        pyenv shell "$BDM_PYTHON_VERSION"
        cmake -P test/cmake/ubuntu-platforms.cmake
        cmake \
          -Dnotebooks=OFF \
          -Dparaview=ON \
          -Dbenchmark=ON \
          -Dlibgit2=ON \
          -Dsbml=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -Dreal_t=double \
          -B build
        cmake --build build --config Release

    - name: Run valgrind and system tests
      shell: bash
      working-directory: build
      run: |
        . "$INSTALL_DIR/bin/thisbdm.sh"
        sudo git config --system user.name "Test User"
        sudo git config --system user.email user@test.com
        export DISPLAY=:99.0
        biodynamo new test-sim
        . ../test/util.inc
        run_cmake_simulation test-sim
        make run-valgrind
        make run-demos
