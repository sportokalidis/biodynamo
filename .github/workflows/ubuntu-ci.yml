name: Ubuntu CI

on:
  push:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout BioDynaMo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select Python version
      run: |
        BDM_PYTHON_VERSION=3.9.1
        if [ -f "util/installation/${{ matrix.os }}/environment.sh" ]; then
          . "util/installation/${{ matrix.os }}/environment.sh"
        fi
        echo "BDM_PYTHON_VERSION=$BDM_PYTHON_VERSION" >> "$GITHUB_ENV"

    - name: Set OSVERS
      run: |
        ID=$(grep -oP '(?<=^ID=).+' /etc/os-release | tr -d '"')
        VERSION=$(grep -oP '(?<=^VERSION_ID=).+' /etc/os-release | tr -d '"')
        echo "OSVERS=$ID-$VERSION" >> $GITHUB_ENV

    - name: Cache pyenv
      uses: actions/cache@v4
      id: pyenv-cache
      with:
        path: ~/.pyenv
        key: ${{ env.OSVERS }}-pyenv-${{ env.BDM_PYTHON_VERSION }}

    - name: Install prerequisites
      run: SILENT_INSTALL=1 ./prerequisites.sh required

    - name: Install CI build dependencies
      run: sudo apt-get install -y gcc-11 g++-11 ninja-build libgit2-dev libboost-dev

    - name: Start Xvfb
      run: |
        set -e
        sudo apt-get -y install xvfb
        XVFBARGS=":99 -ac -screen 0 2560x1440x24"
        /usr/bin/Xvfb $XVFBARGS >> /tmp/Xvfb.out 2>&1 &
        disown -ar
        sleep 3

    - name: Cache Third Party Packages
      uses: actions/cache@v4
      with:
        path: build/third_party
        key: ${{ env.OSVERS }}-third-party-v2-${{ hashFiles('cmake/external/SHA256Digests.cmake', 'cmake/utils.cmake') }}

    - name: Build BioDynaMo
      shell: bash
      run: |
        export PATH="$HOME/.pyenv/bin:$PATH"
        eval "$(pyenv init --path)"
        eval "$(pyenv init -)"
        pyenv shell "$BDM_PYTHON_VERSION"
        cmake --version
        c++ --version
        python test/cmake/cxx23_migration_test.py
        cmake -P test/cmake/ubuntu-platforms.cmake
        cmake -G Ninja \
          -Dparaview=ON \
          -Dbenchmark=ON \
          -Dlibgit2=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -B build
        cmake --build build --parallel --config Release

    - name: Unit tests BioDynaMo
      shell: bash
      working-directory: build
      run: |
        . bin/thisbdm.sh
        bdm config
        bdm-config --cxx-standard
        root-config --cflags
        export DISPLAY=:99.0
        ninja run-unit-tests

    - name: Style guide checks
      shell: bash
      run: |
        export PATH="$HOME/.pyenv/bin:$PATH"
        eval "$(pyenv init --path)"
        eval "$(pyenv init -)"
        pyenv shell 3.9.1
        sudo apt update
        sudo apt install -y cloc clang-tidy-18 clang-format
        cloc --exclude-dir=build .
        cmake -B build
        cd build
        cmake --build . --target fetch-master
        cmake --build . --target gtest || true
        cmake --build . --target show-format || true
        cmake --build . --target show-tidy || true
        cmake --build . --target check-cpplint || true
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-24.04'
